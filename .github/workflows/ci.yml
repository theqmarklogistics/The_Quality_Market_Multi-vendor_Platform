name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  web:
    name: Web — lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Pricing tests
        run: |
          npm run test:pricing
          npm run test:delivery-pricing

      - name: Build
        run: npx next build
        env:
          # Dummy values — the build only needs these to exist. No external
          # service is contacted: DB reads at build time (sitemap) are wrapped
          # in try/catch, and auth-gated pages are force-dynamic.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci_dummy
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CURRENCY_SYMBOL: RWF

  mobile:
    name: Mobile — install & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies (same clean install EAS Build runs)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
