name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  web:
    name: Web — lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must match the Dockerfile / README (>= 22.12): server.js and the
          # pricing scripts are ESM-without-"type" and need module syntax
          # detection, which Node 20 lacks.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Pricing tests
        # On failure, emit the output as a check-run annotation so the cause is
        # visible on the commit page without opening the raw logs.
        env:
          # Dummy values — lib/prisma.js requires DATABASE_URL at import time,
          # but the pricing checks are pure math and never touch the DB.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          for t in test:pricing test:delivery-pricing; do
            if ! out=$(npm run "$t" 2>&1); then
              echo "$out"
              tailout=$(echo "$out" | tail -n 40)
              echo "::error title=$t failed::${tailout//$'\n'/%0A}"
              exit 1
            fi
            echo "$out"
          done

      - name: Build
        run: npx next build
        env:
          # Dummy values — the build only needs these to exist. No external
          # service is contacted: DB reads at build time (sitemap) are wrapped
          # in try/catch, and auth-gated pages are force-dynamic.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci_dummy
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CURRENCY_SYMBOL: RWF

  mobile:
    name: Mobile — install & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies (same clean install EAS Build runs)
        run: |
          if ! out=$(npm ci 2>&1); then
            echo "$out"
            tailout=$(echo "$out" | tail -n 40)
            echo "::error title=mobile npm ci failed::${tailout//$'\n'/%0A}"
            exit 1
          fi
          echo "$out"

      - name: Typecheck
        run: npm run typecheck
